<button type="button" class="library-trigger" [disabled]="disabled" (click)="toggle()" [attr.aria-expanded]="open">Import from library <span>{{open?'⌃':'⌄'}}</span></button>
<section class="library-panel" *ngIf="open" aria-label="Live reference library">
 <header><strong *ngIf="!simpleSearch">Ensembl <span>LIVE</span></strong><select *ngIf="simpleSearch" class="provider-select" aria-label="Reference source" [(ngModel)]="provider" (ngModelChange)="providerChanged()" [disabled]="loading"><option value="ensembl">Ensembl</option><option value="ncbi">NCBI / RefSeq</option></select><button type="button" class="quiet" (click)="toggle()" aria-label="Close reference library">×</button></header>
 <ng-container *ngIf="simpleSearch;else expertSearch">
  <label>Species<input list="sanger-library-species" type="search" [(ngModel)]="speciesInput" (ngModelChange)="speciesTextChanged()" placeholder="e.g. Wheat or Triticum aestivum" [disabled]="loading" (keydown.enter)="$event.preventDefault();simpleSearchGenes()"></label>
  <datalist id="sanger-library-species"><option *ngFor="let name of popularSpecies" [value]="name"></option><option *ngFor="let s of species" [value]="s.name">{{s.display_name}}</option></datalist>
  <label class="simple-query">Gene name or ID<input type="search" [(ngModel)]="query" (ngModelChange)="inputsChanged()" placeholder="e.g. FAD2, BRAF or a stable gene ID" [disabled]="loading" (keydown.enter)="$event.preventDefault();simpleSearchGenes()"></label>
  <button class="simple-search-button" type="button" (click)="simpleSearchGenes()" [disabled]="loading||!query.trim()||!speciesInput.trim()">Search</button>
  <details class="library-advanced"><summary>Advanced</summary><button type="button" class="quiet" *ngIf="provider==='ensembl'" (click)="loadSpecies()" [disabled]="loading">Load species / cultivars</button><div class="fields"><label *ngIf="provider==='ensembl'">Collection<select [(ngModel)]="division" (ngModelChange)="collectionAuto=false;species=[];inputsChanged()" [disabled]="loading"><option value="EnsemblPlants">Plants</option><option value="EnsemblVertebrates">Vertebrates</option><option value="EnsemblMetazoa">Invertebrates</option><option value="EnsemblFungi">Fungi</option><option value="EnsemblProtists">Protists</option></select></label><label>Search by<select [(ngModel)]="searchType" [disabled]="loading"><option value="auto">Name or ID (auto)</option><option value="id">{{provider==='ncbi'?'NCBI Gene ID(s)':'Stable gene ID(s)'}}</option><option value="symbol">Gene symbol</option></select></label><label class="full" *ngIf="searchType==='id'">Gene IDs · up to 8<textarea rows="2" [(ngModel)]="query" [disabled]="loading" (ngModelChange)="inputsChanged()"></textarea></label><label class="full" *ngIf="species.length">{{provider==='ncbi'?'Species':'Species / cultivar'}}<select [(ngModel)]="speciesName" (ngModelChange)="chooseSimpleSpecies()" [disabled]="loading"><option *ngFor="let s of filteredSpecies" [value]="s.name">{{s.display_name}}{{s.strain?' · '+s.strain:''}} · {{s.assembly}}</option></select></label><label>5′ flank (bp)<input type="number" min="0" max="20000" [(ngModel)]="upstream" [disabled]="loading"></label><label>3′ flank (bp)<input type="number" min="0" max="20000" [(ngModel)]="downstream" [disabled]="loading"></label></div><div class="assembly" *ngIf="choice as s">{{s.name}} · {{s.assembly}}</div></details>
 </ng-container><ng-template #expertSearch>
 <div class="fields"><label>Collection<select [(ngModel)]="division" (ngModelChange)="speciesFilter='';loadSpecies()" [disabled]="loading"><option value="EnsemblPlants">Plants</option><option value="EnsemblVertebrates">Vertebrates</option><option value="EnsemblMetazoa">Invertebrates</option><option value="EnsemblFungi">Fungi</option><option value="EnsemblProtists">Protists</option></select></label><label>Filter species / cultivar<input type="search" [(ngModel)]="speciesFilter" (ngModelChange)="filterChanged()" placeholder="e.g. wheat, human, Chinese spring" [disabled]="loading"></label><label class="full">Species / cultivar<select [(ngModel)]="speciesName" (ngModelChange)="inputsChanged()" [disabled]="loading||!species.length"><option value="">Choose species / cultivar</option><option *ngFor="let s of filteredSpecies" [value]="s.name">{{s.display_name}}{{s.strain?' · '+s.strain:''}} · {{s.assembly}}</option></select></label></div>
 <div class="assembly" *ngIf="choice as s"><span>{{s.name}}</span><strong>{{s.assembly}}</strong><span *ngIf="s.release">release {{s.release}}</span></div>
 <div class="query-mode" role="group" aria-label="Reference search type"><button type="button" [class.active]="queryMode==='id'" (click)="queryMode='id';inputsChanged()" [disabled]="loading">Gene ID</button><button type="button" [class.active]="queryMode==='symbol'" (click)="queryMode='symbol';inputsChanged()" [disabled]="loading">Gene name</button></div>
 <label>{{queryMode==='id'?'Stable gene IDs · up to 8':'Gene symbol'}}<textarea rows="2" [(ngModel)]="query" [disabled]="loading" [placeholder]="queryMode==='id'?'e.g. TraesCS4A02G004900':'e.g. BRAF'" (ngModelChange)="genes=[];selected.clear()"></textarea></label><div class="row-actions"><button type="button" (click)="search()" [disabled]="loading||!choice||!query.trim()">Search current catalogue</button><button type="button" class="quiet" (click)="loadSpecies()" [disabled]="loading">Refresh catalogue</button></div>
 </ng-template>
 <div class="gene-results" *ngIf="genes.length"><button type="button" class="gene" *ngFor="let g of genes" (click)="select(g.id)" [class.selected]="selected.has(g.id)" [attr.aria-pressed]="selected.has(g.id)" [disabled]="loading"><strong>{{selected.has(g.id)?'✓ ':''}}{{g.display_name||g.id}}</strong><span *ngIf="g.display_name">{{g.id}}</span><small>{{g.assembly_name}} · {{g.seq_region_name}}:{{g.start|number}}–{{g.end|number}} · {{g.strand===1?'+':'−'}} · {{g.end-g.start+1|number}} bp</small><small *ngIf="g.lookupNote" class="lookup-note">{{g.lookupNote}}</small></button></div>
 <div class="fields flanks" *ngIf="!simpleSearch"><label>5′ flank (bp)<input type="number" min="0" max="20000" step="100" [(ngModel)]="upstream" [disabled]="loading"></label><label>3′ flank (bp)<input type="number" min="0" max="20000" step="100" [(ngModel)]="downstream" [disabled]="loading"></label></div>
 <button type="button" class="import" *ngIf="!simpleSearch||genes.length" (click)="importSelected()" [disabled]="loading||!selected.size">Import {{selected.size||''}} selected</button><div class="loading" *ngIf="loading"><span role="status">{{stage}}</span><button type="button" class="quiet" (click)="cancel()">Cancel</button></div><p class="error" role="alert" *ngIf="error">{{error}}</p>
</section>
