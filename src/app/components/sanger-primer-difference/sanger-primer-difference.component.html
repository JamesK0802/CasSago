<span class="difference-value">{{label(candidate?.primerSafety?.primary)}}</span><button type="button" class="help" [attr.popovertarget]="id" aria-label="Explain primer differences" title="Primer binding details"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 4.5v.5"/></svg></button>
<div class="difference-popover" popover [id]="id" role="dialog" aria-label="Primer difference details"><header><h3>Closest non-intended sites · whole-reference scan</h3><button type="button" [attr.popovertarget]="id" popovertargetaction="hide" aria-label="Close primer differences">×</button></header>
<table><thead><tr><th>Reference</th><th>Sequencing primer</th><th *ngIf="showOpposite">Opposite primer</th></tr></thead><tbody><tr *ngFor="let ref of candidate?.primerSafety?.primary?.references;let i=index"><td>{{ref.reference}}</td><td>{{label(ref)}}</td><td *ngIf="showOpposite">{{label(partnerReference(i))}}</td></tr></tbody></table>
</div>
