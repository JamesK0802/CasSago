<span class="difference-value">{{label(candidate?.primerSafety?.primary)}}</span><button type="button" class="help" [attr.popovertarget]="id" aria-label="Explain primer differences">?</button>
<div class="difference-popover" popover [id]="id" role="dialog" aria-label="Primer difference details"><header><h3>Closest non-intended sites · whole-reference scan</h3><button type="button" [attr.popovertarget]="id" popovertargetaction="hide" aria-label="Close primer differences">×</button></header>
<table><thead><tr><th>Reference</th><th>Sequencing primer</th><th>Opposite primer</th></tr></thead><tbody><tr *ngFor="let ref of candidate?.primerSafety?.primary?.references;let i=index"><td>{{ref.reference}}</td><td>{{label(ref)}}</td><td>{{label(candidate?.primerSafety?.partner?.references?.[i])}}</td></tr></tbody></table>
</div>
