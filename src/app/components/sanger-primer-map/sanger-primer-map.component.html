<section class="primer-map" [class.compact]="compact" *ngIf="groups.length" aria-label="Primer pair map">
 <article class="candidate-map" *ngFor="let group of groups;trackBy:trackGroup" [class.selected]="selected?.id===group.candidate.id">
  <div class="pair-header" *ngIf="!compact"><button class="pair-choice" type="button" (click)="choose(group.candidate)" [attr.aria-pressed]="selected?.id===group.candidate.id" [attr.aria-label]="'Select pair '+(group.index+1)">#{{group.index+1}}</button><button type="button" class="primer-button" (click)="choose(group.candidate)" title="Select primer pair"><strong>{{group.candidate.direction==='forward'?'F →':'R ←'}}</strong><code>{{group.candidate.sequence}}</code></button><button type="button" class="primer-button opposite" (click)="choose(group.candidate)" title="Select primer pair"><code>{{group.candidate.partner?.perReference ? 'Reference-specific PCR primers' : group.candidate.partner?.sequence}}</code></button><span class="quality">{{group.candidate.tm|number:'1.1-1'}}°C · {{group.candidate.gc|number:'1.0-0'}}% GC</span><app-sanger-primer-difference [candidate]="group.candidate" [result]="result" /><button type="button" class="trace-toggle" (click)="toggleTrace(group.candidate)" [attr.aria-expanded]="showChroma && selected?.id===group.candidate.id" [attr.aria-label]="'Toggle WT chromatogram for pair '+(group.index+1)">Show chroma <span class="chroma-chevron">{{showChroma && selected?.id===group.candidate.id?'▴':'▾'}}</span></button></div>
  <div class="map-scroll"><svg [style.aspect-ratio]="'1000 / '+height(group)" [attr.viewBox]="'0 0 1000 '+height(group)" role="img" [attr.aria-label]="'Pair '+(group.index+1)+' sequencing-aligned reference amplicons'">
   <g *ngFor="let tick of group.ticks"><line [attr.x1]="x(tick,group)" [attr.x2]="x(tick,group)" y1="21" [attr.y2]="height(group)-8" class="grid"/><text [attr.x]="x(tick,group)" y="13" text-anchor="middle">{{tick}} bp</text></g>
   <g *ngFor="let track of group.tracks;let i=index;trackBy:trackReference" role="button" tabindex="0" [attr.aria-label]="'Select pair '+(group.index+1)+' on '+track.name" (click)="choose(group.candidate)" (keydown.enter)="choose(group.candidate)">
    <rect x="0" [attr.y]="y(i)-20" width="1000" height="34" class="hit-area"/>
    <text x="10" [attr.y]="y(i)-2" class="reference-name"><title>{{track.name}}{{track.inputReversed?' · Input reverse-complemented':''}}</title>{{track.name.length>17?track.name.slice(0,16)+'…':track.name}}</text><text x="10" [attr.y]="y(i)+12">{{track.length}} bp{{track.inputReversed?' · RC':''}}</text>
    <line [attr.x1]="x(group.low,group)" [attr.x2]="x(track.length+group.low,group)" [attr.y1]="y(i)" [attr.y2]="y(i)" class="product"/>
    <g *ngFor="let cut of track.cuts"><rect [attr.x]="x(windowLow(cut.offset),group)" [attr.y]="y(i)-7" [attr.width]="x(windowHigh(cut.offset),group)-x(windowLow(cut.offset),group)" height="14" rx="7" class="window"/><line [attr.x1]="x(cut.offset,group)" [attr.x2]="x(cut.offset,group)" [attr.y1]="y(i)-10" [attr.y2]="y(i)+10" class="cut"/><text [attr.x]="x(cut.offset,group)" [attr.y]="y(i)-12" text-anchor="middle">{{cut.name}} · {{cut.offset}} bp</text></g>
    <rect *ngFor="let guide of track.guides" [attr.x]="x(Math.min(guide.start,guide.end),group)" [attr.y]="y(i)-3" [attr.width]="Math.abs(x(guide.end,group)-x(guide.start,group))" height="6" rx="3" class="guide"/>
    <g class="binding" role="button" tabindex="0" [attr.aria-label]="'Sequencing primer for pair '+(group.index+1)+' on '+track.name" (mouseenter)="hoverPrimer(group,track,'primary',i)" (mouseleave)="hidePrimer()" (focusin)="hoverPrimer(group,track,'primary',i)" (focusout)="hidePrimer()" (click)="$event.stopPropagation();choose(group.candidate);hoverPrimer(group,track,'primary',i)" (keydown.enter)="$event.stopPropagation();choose(group.candidate);hoverPrimer(group,track,'primary',i)"><title>{{group.candidate.sequence}} · {{track.primary.start+1}}–{{track.primary.end}} · {{track.primary.direction}}</title><rect [attr.x]="x(group.low,group)-3" [attr.y]="y(i)-8" [attr.width]="x(0,group)-x(group.low,group)+6" height="16" class="hit-area"/><line [attr.x1]="x(group.low,group)" [attr.x2]="x(0,group)" [attr.y1]="y(i)" [attr.y2]="y(i)" class="primary"/><line *ngFor="let position of track.primary.mismatchPositions" [attr.x1]="x(mismatchLow(position,group)+0.5,group)" [attr.x2]="x(mismatchLow(position,group)+0.5,group)" [attr.y1]="y(i)-6" [attr.y2]="y(i)+6" class="primer-mismatch"/></g>
    <g class="binding" *ngIf="track.partner as p" role="button" tabindex="0" [attr.aria-label]="'Opposite primer for pair '+(group.index+1)+' on '+track.name" (mouseenter)="hoverPrimer(group,track,'partner',i)" (mouseleave)="hidePrimer()" (focusin)="hoverPrimer(group,track,'partner',i)" (focusout)="hidePrimer()" (click)="$event.stopPropagation();choose(group.candidate);hoverPrimer(group,track,'partner',i)" (keydown.enter)="$event.stopPropagation();choose(group.candidate);hoverPrimer(group,track,'partner',i)"><title>{{oppositeSequence(group,track)}} · {{p.start+1}}–{{p.end}} · {{p.direction}}</title><rect [attr.x]="x(start(p,track.primary),group)-3" [attr.y]="y(i)-8" [attr.width]="x(end(p,track.primary),group)-x(start(p,track.primary),group)+6" height="16" class="hit-area"/><line [attr.x1]="x(start(p,track.primary),group)" [attr.x2]="x(end(p,track.primary),group)" [attr.y1]="y(i)" [attr.y2]="y(i)" class="partner" [style.stroke]="oppositeColour(group,track)"/></g>
    <g class="primer-hover" *ngIf="hover?.id===group.candidate.id && hover?.reference===track.name" aria-live="polite" pointer-events="none"><rect [attr.x]="hover!.left-72" [attr.y]="hover!.top-14" [attr.width]="hover!.cells.length*7.3+82" height="38" rx="7"/><text [attr.x]="hover!.left-66" [attr.y]="hover!.top">Primer</text><text [attr.x]="hover!.left" [attr.y]="hover!.top">{{hover!.sequence}}</text><text [attr.x]="hover!.left-66" [attr.y]="hover!.top+16">Reference</text><text [attr.x]="hover!.left" [attr.y]="hover!.top+16"><tspan *ngFor="let cell of hover!.cells" [class.mismatch-base]="cell.mismatch">{{cell.base}}</tspan></text></g>
   </g>
  </svg></div>
  <div class="compact-map-footer" *ngIf="compact"><ng-content select="[map-actions]" /><button *ngIf="showOpposite" type="button" class="trace-toggle" (click)="toggleTrace(group.candidate)" [attr.aria-expanded]="showChroma" aria-label="Toggle chromatogram inside map">Chromatogram <span class="chroma-chevron">{{showChroma?'▴':'▾'}}</span></button></div>
  <app-sanger-wt-preview *ngIf="showOpposite && selected?.id===group.candidate.id && showChroma" [result]="result" [selected]="group.candidate" />
 </article>
</section>
