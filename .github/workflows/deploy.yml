name: Test and deploy CasSago

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NEXT_CODEX_HANDOFF.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NG_BUILD_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check primer workflow and application navigation
        run: npm run test:primer -- --maxWorkers=2
      - name: Check engine completion and original-model fallback
        run: npm run test:engine-completion
      - name: Check reference-specific photon calibration
        run: npm run test:engine-calibration
      - name: Build for CasSago Pages
        run: npm run build -- --base-href /CasSago/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cassago/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
